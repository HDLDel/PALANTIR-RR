version: 1
script:
  - pip3 install -r requirements.txt
  - pip3 install pyinstaller
  - pyinstaller --onefile --console --icon=palantir.png --add-data "assets:assets" --add-data "*.json:." --add-data "*.conf:." Palantir-Linux.py

AppDir:
  path: ./AppDir
  app_info:
    id: com.palantir.app
    name: Palantir
    icon: palantir
    exec: usr/bin/palantir
    version: 1.0.0
    categories:
      - AudioVideo
      - Video
    license: MIT
    description: Gerenciador de Mídia Palantir 